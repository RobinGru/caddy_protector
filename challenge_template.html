<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Sicherheitsprüfung</title>
        <style nonce="{{ .CSPNonce }}">
            :root {
                color-scheme: light dark;
                font-family: system-ui, sans-serif;
                --background: #f5f5f5;
                --surface: #fff;
                --text: #1a1a1a;
                --muted: #666;
                --border: #ddd;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --background: #111;
                    --surface: #1c1c1c;
                    --text: #f5f5f5;
                    --muted: #aaa;
                    --border: #333;
                }
            }

            * { box-sizing: border-box; }

            body {
                display: grid;
                min-height: 100vh;
                margin: 0;
                place-items: center;
                padding: 1.5rem;
                background: var(--background);
                color: var(--text);
            }

            main {
                width: min(100%, 28rem);
                padding: 2rem;
                border: 1px solid var(--border);
                border-radius: 0.5rem;
                background: var(--surface);
                text-align: center;
            }

            h1 {
                margin: 0;
                font-size: 1.25rem;
            }

            p {
                margin: 0.75rem 0 1.5rem;
                color: var(--muted);
                line-height: 1.5;
            }

            #status {
                min-height: 1.5rem;
                margin-bottom: 1rem;
                color: var(--muted);
                font-size: 0.9rem;
            }
        </style>
    </head>
    <body>
        <main aria-labelledby="page-title">
            <h1 id="page-title">Sicherheitsüberprüfung</h1>
            <p>
                Diese Website überprüft, dass Sie kein böswilliger Bot sind.
                Sie werden anschließend automatisch weitergeleitet.
            </p>

            <div id="status" role="status" aria-live="polite" aria-atomic="true">
                Prüfung wird vorbereitet...
            </div>

            <cap-widget
                id="cap-widget"
                data-cap-api-endpoint="{{ .CapAPIEndpoint }}"
                data-cap-i18n-initial-state="Browser prüfen"
                data-cap-i18n-verifying-label="Prüfung läuft..."
                data-cap-i18n-solved-label="Prüfung erfolgreich"
                data-cap-i18n-error-label="Fehler"
            ></cap-widget>
        </main>

        <script nonce="{{ .CSPNonce }}">
            window.CAP_SCRIPT_NONCE = "{{ .CSPNonce }}";
            window.CAP_CSS_NONCE = "{{ .CSPNonce }}";
            window.CAP_CUSTOM_WASM_URL = "{{ .CapWASMURL }}";
            window.__BOT_BARRIER__ = {{ .ConfigJSON }};
        </script>
        <script nonce="{{ .CSPNonce }}" type="module" src="{{ .CapWidgetScript }}"></script>
        <script nonce="{{ .CSPNonce }}" type="module">
            const statusEl = document.getElementById("status");
            const widget = document.getElementById("cap-widget");
            const config = window.__BOT_BARRIER__;

            widget.addEventListener("progress", (event) => {
                statusEl.textContent = `Prüfung läuft... ${event.detail.progress}%`;
            });

            widget.addEventListener("error", (event) => {
                statusEl.textContent = event.detail.message || "Die Prüfung ist fehlgeschlagen. Bitte laden Sie die Seite neu.";
            });

            widget.addEventListener("solve", async (event) => {
                statusEl.textContent = "Verifikation wird abgeschlossen...";
                try {
                    const response = await fetch(config.verifyPath, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ token: event.detail.token, state: config.state }),
                    });

                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok || !payload.ok || !payload.returnTo) {
                        throw new Error("Verifikation fehlgeschlagen");
                    }

                    statusEl.textContent = "Prüfung erfolgreich. Weiterleitung...";
                    window.location.replace(payload.returnTo);
                } catch (error) {
                    statusEl.textContent = "Die Prüfung ist fehlgeschlagen. Bitte laden Sie die Seite neu.";
                    console.error(error);
                }
            });

            async function startVerification() {
                statusEl.textContent = "Prüfung startet...";

                await customElements.whenDefined("cap-widget");
                if (typeof widget.solve !== "function") {
                    throw new Error("cap-widget unterstützt kein programmgesteuertes Starten");
                }

                await widget.solve();
            }

            startVerification().catch((error) => {
                statusEl.textContent = "Die Prüfung konnte nicht gestartet werden. Bitte laden Sie die Seite neu.";
                console.error(error);
            });
        </script>
    </body>
</html>
